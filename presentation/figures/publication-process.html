<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publication process</title>
<style>
  html, body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 16px; max-width: 900px; }
  body.light { background: #fff; color: #1f2937; }
  body.dark  { background: #111827; color: #f3f4f6; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .controls button { font: inherit; padding: 6px 12px; border: 1px solid #94a3b8; background: #f1f5f9; color: #1f2937;
    border-radius: 6px; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: #d97706; color: #fff; border-color: #d97706; }
  .controls .sep { flex: 1; }
  body.embed .controls { display: none; }
  body.embed { padding: 0; }
  #fig svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="controls">
  <span>You are here:</span>
  <button data-here="early" aria-pressed="false">Early phases</button>
  <button data-here="data-editor" aria-pressed="false">Data editor</button>
  <button data-here="transition" aria-pressed="false">Transition</button>
  <button data-here="none" aria-pressed="false">No marker</button>
  <span class="sep"></span>
  <button id="dl-svg">Download SVG</button>
  <button id="dl-png">Download PNG</button>
</div>
<div id="fig"></div>
<script src="publication-process.js"></script>
<script>
const { VIEWS, VB_W, VB_H, buildSVG } = PublicationFigure;

// URL parameters: ?here=early|data-editor|none  &embed=1 hides the controls  &theme=light|dark (default: follow OS)
const params = new URLSearchParams(location.search);
let current = params.get("here") in VIEWS ? params.get("here") : "early";
const dark = window.matchMedia("(prefers-color-scheme: dark)");
const theme = () => params.get("theme") || (dark.matches ? "dark" : "light");
if (params.get("embed")) document.body.classList.add("embed");

function render() {
  document.body.className = theme() + (params.get("embed") ? " embed" : "");
  document.getElementById("fig").innerHTML = buildSVG(current, { theme: theme(), animate: true });
  document.querySelectorAll("[data-here]").forEach(b => b.setAttribute("aria-pressed", b.dataset.here === current));
  const u = new URL(location); u.searchParams.set("here", current); history.replaceState(null, "", u);
}
document.querySelectorAll("[data-here]").forEach(b => b.onclick = () => { current = b.dataset.here; render(); });
dark.addEventListener("change", render);

// Exports (the slides get their images from build-figures.ts instead; these are for ad-hoc use)
const SCALE = 2;
const standalone = () => buildSVG(current, { theme: theme(), scale: SCALE });
function save(blob, name) {
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("dl-svg").onclick = () =>
  save(new Blob([standalone()], { type: "image/svg+xml" }), `publication-process-${current}.svg`);
document.getElementById("dl-png").onclick = () => {
  const img = new Image();
  img.onload = () => {
    const c = Object.assign(document.createElement("canvas"), { width: VB_W * SCALE, height: VB_H * SCALE });
    c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob(b => save(b, `publication-process-${current}.png`));
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(standalone());
};

render();
</script>
</body>
</html>
